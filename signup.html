<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - RightBite</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-visual">
          <a class="auth-logo" href="index.html" aria-label="RightBite home">
            <img src="RBlogo.png" alt="RightBite">
          </a>
          <h1>Fresh Starts.</h1>
          <p>Build better food habits with a cleaner, greener plate.</p>
        </div>

        <div class="auth-panel">
          <h2>Sign Up</h2>
          <p class="auth-switch auth-switch-top">
            Already a member?
            <a href="signin.html">Sign In</a>
          </p>
          <form class="auth-form" id="signup-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Full name" required>

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="Email" required>

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="Password" minlength="8" required>

            <div class="password-rules" id="password-rules" aria-live="polite">
              <p>Password must include:</p>
              <ul>
                <li data-rule="length">At least 8 characters</li>
                <li data-rule="lowercase">One lowercase letter</li>
                <li data-rule="uppercase">One uppercase letter</li>
                <li data-rule="number">One number</li>
                <li data-rule="special">One special character</li>
              </ul>
            </div>

            <label class="auth-check">
              <input type="checkbox" name="terms" required>
              I accept terms and conditions
            </label>

            <button type="submit" class="auth-submit">Create Account</button>
            <p class="auth-message" id="signup-message" aria-live="polite"></p>
          </form>

          <div class="auth-divider"><span>or sign up with</span></div>

          <div class="social-login" aria-label="Social sign up options">
            <button type="button" aria-label="Sign up with Google">Google</button>
            <button type="button" aria-label="Sign up with Apple">Apple</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="firebase-auth.js"></script>
  </body>
</html>
