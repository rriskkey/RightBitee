<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - RightBite</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-visual">
          <a class="auth-logo" href="index.html" aria-label="RightBite home">
            <img src="RBlogo.png" alt="RightBite">
          </a>
          <h1>Welcome Back.</h1>
          <p>Your fresh choices and balanced meals are waiting.</p>
        </div>

        <div class="auth-panel">
          <h2>Sign In</h2>
          <p class="auth-switch auth-switch-top">
            New here?
            <a href="signup.html">Sign Up</a>
          </p>
          <form class="auth-form" id="signin-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>

            <div class="auth-form-row">
              <label class="auth-check">
                <input type="checkbox" name="remember">
                Remember me
              </label>
              <button class="auth-link-button" type="button" id="forgot-password">Forgot password?</button>
            </div>

            <button type="submit" class="auth-submit">Sign In</button>
            <p class="auth-message" id="signin-message" aria-live="polite"></p>
          </form>

          <div class="auth-divider"><span>or sign in with</span></div>

          <div class="social-login" aria-label="Social login options">
            <button type="button" id="google-signin" aria-label="Sign in with Google">Google</button>
            <button type="button" aria-label="Sign in with Apple">Apple</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="firebase-auth.js?v=5"></script>
  </body>
</html>
