<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - RightBite</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="searc-page">
    <header class="searc-header">
      <a class="searc-brand" href="index.html" aria-label="RightBite home">
        <img src="RBlogo.png" alt="RightBite">
      </a>
      <div class="searc-tagline">
        <p>Pick your taste. Find your bite.</p>
        <span>Sweet, spicy, sour, bitter, or umami.</span>
      </div>
    </header>

    <main class="searc-stage">
      <section class="searc-grid" aria-label="Food taste categories">
        <a class="searc-card" href="#" aria-label="Sweet category">
          <img src="assets/search/sweet.png" alt="Green chocolate pieces">
          <strong>SWEET</strong>
        </a>

        <a class="searc-card" href="#" aria-label="Spicy category">
          <img src="assets/search/spicy.png" alt="Green crispy spicy chips">
          <strong>SPICY</strong>
        </a>

        <a class="searc-card" href="#" aria-label="Sour category">
          <img src="assets/search/sour.png" alt="Green sour candy">
          <strong>SOUR</strong>
        </a>

        <a class="searc-card" href="#" aria-label="Bitter category">
          <img src="assets/search/bitter.png" alt="Matcha cups">
          <strong>BITTER</strong>
        </a>

        <a class="searc-card" href="#" aria-label="Umami category">
          <img src="assets/search/umami.png" alt="Green umami snack mix">
          <strong>UMAMI</strong>
        </a>

        <a class="searc-card searc-card-all" href="#" aria-label="All categories">
          <img src="assets/search/all.png" alt="Green foods from all taste categories">
          <strong>ALL</strong>
        </a>
      </section>
    </main>
  </body>
</html>
